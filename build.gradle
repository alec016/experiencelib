plugins {
  id 'java-library'
  id 'idea'
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.105'
  id "es.degrassi.unified-publishing-with-mmr-bot" version "1.3.0"
  id "io.freefair.lombok" version "8.6"
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

base {
  archivesName = archives_base_name
  version = "${minecraft_version}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

tasks.processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

neoForge {
  version = project.neo_version

  parchment {
    mappingsVersion = project.parchment_mappings_version
    minecraftVersion = project.parchment_minecraft_version
  }

  File transformer = rootProject.file("src/main/resources/META-INF/accesstransformer.cfg")
  if (transformer.exists()) {
    accessTransformers.from transformer
  }

  runs {
    client {
      client()
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    server {
      server()
      programArgument "--nogui"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    gameTestServer {
      type = "gameTestServer"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    data {
      data()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }
  }

  mods {
    "${mod_id}" {
      sourceSet(sourceSets.main)
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
  runtimeClasspath.extendsFrom localRuntime
  libraries
  // This will make sure that all dependencies that you add to the libraries configuration will also be added to the implementation configuration
  // This way, you only need one dependency declaration for both runtime and compile dependencies
  implementation.extendsFrom libraries
}

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
  maven {
    name = "Forge"
    url = "https://maven.minecraftforge.net"
  }
  maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
  }
  maven {
    name = "Mod maven"
    url = "https://modmaven.dev/"
  }
  maven {
    name = "TerraformersMC"
    url = "https://maven.terraformersmc.com/"
  }
}

dependencies {
  // lombok
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  implementation "net.neoforged:neoforge:${neo_version}"

  // JEI
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
  compileOnly localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

  // EMI
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
  compileOnly localRuntime("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      minecraft_version      : minecraft_version,
      minecraft_version_range: minecraft_version_range,
      neo_version            : neo_version,
      neo_version_range      : neo_version_range,
      loader_version_range   : loader_version_range,
      mod_id                 : mod_id,
      mod_name               : mod_name,
      mod_license            : mod_license,
      mod_version            : mod_version,
      mod_authors            : mod_authors,
      mod_description        : mod_description,
      mod_url                : mod_url,
      icon                   : icon,
      pack_format_number     : pack_format_number
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = archivesBaseName
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'https://maven.degrassi.es/releases'
      credentials {
        username = "Alec_016GG"
        password = System.getenv("MAVEN_PASSWORD")
      }
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "[NeoForge]ExperienceLib-${minecraft_version}-${mod_version}"
    releaseType = "release"
    if (rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${minecraft_version}", "1.21"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = mod_id
    modVersion = "ExperienceLib-${minecraft_version}-${mod_version}"

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
      curseforge {
        token = CURSE_API_KEY
        id = "1156551"
        gameVersions.addAll "Java 21"
      }
    }

    var MODRINTH_API_KEY = System.getenv("MODRINTH")
    if (MODRINTH_API_KEY != null) {
      modrinth {
        token = MODRINTH_API_KEY
        id = "SglcIh0L"
      }
    }
  }
}
